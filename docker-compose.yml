version: '3.8'

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      ENV: production
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: livepoll
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  mongo-data:
  redis-data:
